<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barista Training Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Barista Training Tracker</h1>
    <p class="subtitle">What has this trainee covered, and what is left?</p>
  </header>

  <main>
    <section class="card">
      <label class="field-label" for="trainee-select">Trainee</label>
      <select id="trainee-select"></select>

      <form id="add-form">
        <input id="new-name" type="text" placeholder="First name"
               aria-label="New trainee's first name">
        <button type="submit">Add trainee</button>
      </form>
    </section>

    <section class="card">
      <h2 id="trainee-name">No trainees yet</h2>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p id="progress-text">Loading skills…</p>
      <button type="button" id="remove-button" class="remove-button" hidden>Remove this trainee</button>
    </section>

    <section class="card" id="next-card" hidden>
      <h2>Cover next shift</h2>
      <ol id="next-list"></ol>
      <p id="next-note"></p>
    </section>

    <!-- app.js fills this in from skills.json -->
    <div id="checklist"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
